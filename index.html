<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3ee">
  <title>音檔播放器</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #202321;
      --muted: #747a75;
      --paper: #f5f3ee;
      --card: #fffefa;
      --line: #e7e5de;
      --accent: #426b54;
      --accent-soft: #edf3ed;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 48px 20px;
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
    }
    main { width: min(100%, 680px); margin: 0 auto; }
    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .16em;
    }
    h1 { margin: 0; font-size: clamp(30px, 6vw, 46px); letter-spacing: -.04em; }
    .intro { margin: 12px 0 30px; color: var(--muted); font-size: 15px; line-height: 1.7; }
    .tracks { display: grid; gap: 12px; }
    .track {
      display: grid;
      grid-template-columns: 54px 1fr auto;
      align-items: center;
      gap: 16px;
      min-height: 88px;
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--card);
      transition: border-color .18s ease, background .18s ease, transform .18s ease;
    }
    .track.is-playing { border-color: #a8bbaa; background: #fbfdf9; }
    .play-button {
      display: grid;
      width: 52px;
      height: 52px;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent);
      cursor: pointer;
      transition: transform .16s ease, background .16s ease;
    }
    .play-button:hover { transform: scale(1.05); background: #e2ece3; }
    .play-button:focus-visible { outline: 3px solid #91b398; outline-offset: 3px; }
    .play-button svg { width: 19px; height: 19px; fill: currentColor; }
    .track-title { margin: 0; font-size: 16px; font-weight: 650; }
    .track-file { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
    .track-number { color: #9b9e99; font-variant-numeric: tabular-nums; font-size: 13px; }
    .player {
      margin-top: 20px;
      padding: 18px 20px 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--card);
    }
    .player-label { display: flex; justify-content: space-between; gap: 16px; margin-bottom: 10px; font-size: 13px; }
    .now-playing { color: var(--accent); font-weight: 650; }
    .hint { color: var(--muted); }
    audio { display: block; width: 100%; height: 38px; }
    .status { min-height: 22px; margin: 10px 2px 0; color: var(--muted); font-size: 13px; }
    @media (max-width: 480px) {
      body { padding: 32px 16px; }
      .track { grid-template-columns: 48px 1fr auto; gap: 12px; padding: 14px; }
      .play-button { width: 46px; height: 46px; }
      .player { padding: 16px 14px 12px; }
      .hint { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">AUDIO PLAYER</p>
    <h1>音檔播放器</h1>
    <p class="intro">選擇下方按鈕播放音檔。播放進度與音量可在播放器中調整。</p>

    <section class="tracks" aria-label="音檔清單">
      <article class="track" data-track="0">
        <button class="play-button" type="button" aria-label="播放 you are my destiny" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5c0-.77.84-1.25 1.5-.86l10.1 6.03a1 1 0 0 1 0 1.72L9.5 18.42A1 1 0 0 1 8 17.56z"/></svg>
        </button>
        <div><h2 class="track-title">you are my destiny</h2><p class="track-file">1.mov</p></div>
        <span class="track-number">01</span>
      </article>
      <article class="track" data-track="1">
        <button class="play-button" type="button" aria-label="播放 bang bang bang" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5c0-.77.84-1.25 1.5-.86l10.1 6.03a1 1 0 0 1 0 1.72L9.5 18.42A1 1 0 0 1 8 17.56z"/></svg>
        </button>
        <div><h2 class="track-title">bang bang bang</h2><p class="track-file">2.mov</p></div>
        <span class="track-number">02</span>
      </article>
      <article class="track" data-track="2">
        <button class="play-button" type="button" aria-label="播放 water" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5c0-.77.84-1.25 1.5-.86l10.1 6.03a1 1 0 0 1 0 1.72L9.5 18.42A1 1 0 0 1 8 17.56z"/></svg>
        </button>
        <div><h2 class="track-title">water</h2><p class="track-file">3.mov</p></div>
        <span class="track-number">03</span>
      </article>
      <article class="track" data-track="3">
        <button class="play-button" type="button" aria-label="播放蝴蝶蝴蝶真美麗" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5c0-.77.84-1.25 1.5-.86l10.1 6.03a1 1 0 0 1 0 1.72L9.5 18.42A1 1 0 0 1 8 17.56z"/></svg>
        </button>
        <div><h2 class="track-title">蝴蝶蝴蝶真美麗</h2><p class="track-file">4.mov</p></div>
        <span class="track-number">04</span>
      </article>
    </section>

    <section class="player" aria-label="播放控制">
      <div class="player-label"><span class="now-playing" aria-live="polite">尚未播放</span><span class="hint">播放控制</span></div>
      <audio id="audio" controls preload="none"></audio>
    </section>
    <p class="status" id="status" role="status">按任一按鈕開始播放。</p>
  </main>

  <script>
    const tracks = ["audio/1.m4a", "audio/2.m4a", "audio/3.m4a", "audio/4.m4a"];
    const trackNames = ["you are my destiny", "bang bang bang", "water", "蝴蝶蝴蝶真美麗"];
    const audio = document.querySelector("#audio");
    const cards = [...document.querySelectorAll(".track")];
    const nowPlaying = document.querySelector(".now-playing");
    const status = document.querySelector("#status");
    let selected = -1;

    function paintPlaying(playing) {
      cards.forEach((card, index) => {
        const button = card.querySelector("button");
        const isActive = index === selected && playing;
        card.classList.toggle("is-playing", isActive);
        button.setAttribute("aria-pressed", String(isActive));
        button.setAttribute("aria-label", `${isActive ? "暫停" : "播放"}${trackNames[index]}`);
        button.innerHTML = isActive
          ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg>'
          : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5c0-.77.84-1.25 1.5-.86l10.1 6.03a1 1 0 0 1 0 1.72L9.5 18.42A1 1 0 0 1 8 17.56z"/></svg>';
      });
    }

    cards.forEach((card, index) => {
      card.querySelector("button").addEventListener("click", async () => {
        if (selected === index && !audio.paused) {
          audio.pause();
          return;
        }
        if (selected !== index) {
          selected = index;
          audio.src = tracks[index];
          audio.load();
          nowPlaying.textContent = `正在播放：${trackNames[index]}`;
        }
        try {
          await audio.play();
          status.textContent = `正在播放「${trackNames[index]}」。`;
        } catch {
          status.textContent = "無法播放此音檔，請確認音檔檔案仍在 audio 資料夾中。";
        }
      });
    });

    audio.addEventListener("play", () => paintPlaying(true));
    audio.addEventListener("pause", () => paintPlaying(false));
    audio.addEventListener("ended", () => {
      paintPlaying(false);
      status.textContent = "播放完成。選擇其他按鈕可播放下一個音檔。";
    });
    audio.addEventListener("error", () => {
      if (selected >= 0) status.textContent = "無法讀取音檔，請確認 audio 資料夾內有對應檔案。";
    });
  </script>
</body>
</html>
